
x-superset-image: &superset-image
  image: climsoftdevelopers/climsoft-superset:preview-3.0.3

x-superset-env: &superset-env
  SUPERSET_SECRET_KEY: "${SUPERSET_SECRET_KEY}"
  SQLALCHEMY_DATABASE_URI: "postgresql+psycopg2://postgres:${DB_PASSWORD}@climsoft_db:5432/superset"
  REDIS_URL: "redis://climsoft_superset_redis:6379/0"

x-climsoft-db-env: &climsoft-db-env
  DB_HOST: climsoft_db
  DB_NAME: "${DB_NAME}"
  DB_PASSWORD: "${DB_PASSWORD}"

services:
  climsoft_nginx_proxy:
    image: climsoftdevelopers/climsoft-nginx-proxy:preview-3.0.3
    container_name: climsoft-nginx-proxy
    restart: always
    environment:
      # Substituted into nginx.conf's Superset server block by the base
      # image's envsubst-on-templates entrypoint (wired up in the image's
      # own Dockerfile, see the repo root).
      SUPERSET_HOSTNAME: "${SUPERSET_HOSTNAME}"
    ports:
      - "${HOST_HTTP_PORT}:80"
    depends_on:
      - climsoft_pwa
      - climsoft_api
    networks:
      - climsoft_network

  climsoft_pwa:
    image: climsoftdevelopers/climsoft-pwa:preview-3.0.3
    container_name: climsoft-pwa
    restart: always
    expose:
      - 80 # Expose to internal network only.
    depends_on:
      - climsoft_api
    networks:
      - climsoft_network

  climsoft_api:
    image: climsoftdevelopers/climsoft-api:preview-3.0.3
    container_name: climsoft-api
    restart: always
    environment:
      <<: *climsoft-db-env
      ENCRYPTION_SECRET: "${ENCRYPTION_SECRET}"
      FIRST_INSTALL: "${FIRST_INSTALL}"
      V4_SAVE: "${V4_SAVE}"
      V4_IMPORT: "${V4_IMPORT}"
      V4_DB_HOST: "${V4_DB_HOST}"
      V4_DB_PORT: "${V4_DB_PORT}"
      V4_DB_NAME: "${V4_DB_NAME}"
      V4_DB_USERNAME: "${V4_DB_USERNAME}"
      V4_DB_PASSWORD: "${V4_DB_PASSWORD}"
      V4_DB_UTCOFFSET: "${V4_DB_UTCOFFSET}"
      PYTHON_RUNNER_ENABLED: "${PYTHON_RUNNER_ENABLED:-false}"
      PYTHON_RUNNER_HOST: climsoft_python_runner
      R_RUNNER_ENABLED: "${R_RUNNER_ENABLED:-false}"
      R_RUNNER_HOST: climsoft_r_runner
      JAVASCRIPT_RUNNER_ENABLED: "${JAVASCRIPT_RUNNER_ENABLED:-false}"
      JAVASCRIPT_RUNNER_HOST: climsoft_javascript_runner
      DUCKDB_RUNNER_ENABLED: "${DUCKDB_RUNNER_ENABLED:-false}"
      DUCKDB_RUNNER_HOST: climsoft_duckdb_runner
      SUPERSET_ENABLED: "${SUPERSET_ENABLED:-false}"
      SUPERSET_HOST: climsoft_superset
      SUPERSET_SERVICE_USERNAME: "${SUPERSET_SERVICE_USERNAME}"
      SUPERSET_SERVICE_PASSWORD: "${SUPERSET_SERVICE_PASSWORD}"
    # Only relevant if a legacy Climsoft v4 database is reachable from the
    # host; harmless otherwise. Required for V4_DB_HOST=host.docker.internal
    # to resolve on native Linux Docker (Docker Desktop maps this automatically).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - 3000
    depends_on:
      climsoft_db:
        condition: service_healthy
    volumes:
      - climsoft_operations:/app/operations
      - climsoft_adapters:/app/adapters
    networks:
      - climsoft_network

  climsoft_python_runner:
    image: climsoftdevelopers/climsoft-python-runner:preview-3.0.3
    container_name: climsoft-python-runner
    restart: always
    profiles: ["adapters-python"]
    expose:
      - 5101
    volumes:
      - climsoft_adapters:/app/adapters
      - climsoft_operations:/app/operations
    networks:
      - climsoft_network

  climsoft_r_runner:
    image: climsoftdevelopers/climsoft-r-runner:preview-3.0.3
    container_name: climsoft-r-runner
    restart: always
    profiles: ["adapters-r"]
    expose:
      - 5102
    volumes:
      - climsoft_adapters:/app/adapters
      - climsoft_operations:/app/operations
    networks:
      - climsoft_network

  climsoft_javascript_runner:
    image: climsoftdevelopers/climsoft-javascript-runner:preview-3.0.3
    container_name: climsoft-javascript-runner
    restart: always
    profiles: ["adapters-javascript"]
    expose:
      - 5103
    volumes:
      - climsoft_adapters:/app/adapters
      - climsoft_operations:/app/operations
    networks:
      - climsoft_network

  climsoft_duckdb_runner:
    image: climsoftdevelopers/climsoft-duckdb-runner:preview-3.0.3
    container_name: climsoft-duckdb-runner
    restart: always
    profiles: ["adapters-duckdb"]
    expose:
      - 5104
    volumes:
      - climsoft_adapters:/app/adapters
      - climsoft_operations:/app/operations
    networks:
      - climsoft_network

  climsoft_superset_redis:
    image: redis:7-alpine
    container_name: climsoft-superset-redis
    profiles: ["superset"]
    restart: always
    expose:
      - 6379
    networks:
      - climsoft_network

  climsoft_superset_init:
    <<: *superset-image
    container_name: climsoft-superset-init
    profiles: ["superset"]
    command: ["/app/init.sh"]
    environment:
      <<: [*superset-env, *climsoft-db-env]
      ADMIN_USERNAME: "${SUPERSET_ADMIN_USERNAME}"
      ADMIN_PASSWORD: "${SUPERSET_ADMIN_PASSWORD}"
      SERVICE_USERNAME: "${SUPERSET_SERVICE_USERNAME}"
      SERVICE_PASSWORD: "${SUPERSET_SERVICE_PASSWORD}"
      CLIMSOFT_READER_PASSWORD: "${CLIMSOFT_READER_PASSWORD}"
    depends_on:
      climsoft_db:
        condition: service_healthy
      climsoft_superset_redis:
        condition: service_started
    networks:
      - climsoft_network

  climsoft_superset:
    <<: *superset-image
    container_name: climsoft-superset
    profiles: ["superset"]
    restart: always
    command: ["/app/docker/entrypoints/run-server.sh"]
    environment:
      <<: *superset-env
      SERVER_WORKER_AMOUNT: 10
      SERVER_WORKER_CLASS: gevent
      SERVER_THREADS_AMOUNT: 1000
      GUNICORN_TIMEOUT: 120
    # Reached through climsoft_nginx_proxy's SUPERSET_HOSTNAME server block —
    # no longer published directly, so Superset traffic always goes through
    # nginx's request-handling behavior too.
    expose:
      - 8088
    depends_on:
      climsoft_superset_init:
        condition: service_completed_successfully
    # Overrides the apache/superset base image's own baked-in HEALTHCHECK,
    # which polls every few seconds by default and floods `docker compose logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 3600s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - climsoft_superset_home:/app/superset_home
    networks:
      - climsoft_network

  climsoft_superset_worker:
    <<: *superset-image
    container_name: climsoft-superset-worker
    profiles: ["superset"]
    restart: always
    command: ["/app/worker.sh"]
    environment:
      <<: *superset-env
    depends_on:
      climsoft_superset_init:
        condition: service_completed_successfully
    networks:
      - climsoft_network

  climsoft_superset_beat:
    <<: *superset-image
    container_name: climsoft-superset-beat
    profiles: ["superset"]
    restart: always
    command: ["/app/beat.sh"]
    environment:
      <<: *superset-env
    depends_on:
      climsoft_superset_init:
        condition: service_completed_successfully
    networks:
      - climsoft_network

  climsoft_db:
    image: postgis/postgis:17-3.5
    container_name: climsoft-db
    restart: always
    environment:
      POSTGRES_DB: "${DB_NAME}"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "5432:5432"
    volumes:
      - climsoft_database:/var/lib/postgresql/data
      - climsoft_operations:/var/lib/postgresql/operations
    networks:
      - climsoft_network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  climsoft_database:
  climsoft_operations:
  climsoft_adapters:
  climsoft_superset_home:

networks:
  climsoft_network:
