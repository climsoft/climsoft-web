events {}

# Dev-only nginx config, used by docker-compose.dev.yaml.
#
# The /api/ and /superset/ blocks below are otherwise identical to nginx.conf
# (body size limits, timeouts, buffering) on purpose: those are real
# production request-handling behaviors — e.g. upload size limits — that a
# request talking directly to climsoft_api:3000 would never exercise.
#
# location / proxies to climsoft_pwa's `ng serve` (port 4200) rather than an
# nginx-served static build, unlike nginx.conf's equivalent block — dev never
# builds the PWA, it runs the dev server live. The websocket upgrade headers
# are there for Angular's live-reload/HMR channel, same as the /superset/
# block already needs them for Superset's async queries.
http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    server_name _;

    client_max_body_size 1g;
    client_body_timeout 300s;

    location /superset/ {
      proxy_pass http://climsoft_superset:8088/;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;

      proxy_redirect http://climsoft_superset:8088/ /;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_connect_timeout 30s;
      proxy_read_timeout 300s;
    }

    location /api/ {
      proxy_pass http://climsoft_api:3000/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Origin $http_origin;

      proxy_connect_timeout 300s;
      proxy_send_timeout 300s;
      proxy_read_timeout 300s;
      proxy_request_buffering off;
      proxy_buffering off;
    }

    location / {
      proxy_pass http://climsoft_pwa:4200;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
