events {}

# Dev-only nginx config, used by docker-compose.dev.yaml.
#
# The /api/ and Superset blocks below are otherwise identical to nginx.conf
# (body size limits, timeouts, buffering) on purpose: those are real
# production request-handling behaviors — e.g. upload size limits — that a
# request talking directly to climsoft_api:3000 would never exercise.
#
# location / proxies to climsoft_pwa's `ng serve` (port 4200) rather than an
# nginx-served static build, unlike nginx.conf's equivalent block — dev never
# builds the PWA, it runs the dev server live. The websocket upgrade headers
# are there for Angular's live-reload/HMR channel, same as the Superset
# server block already needs them for Superset's async queries.
#
# Superset gets its own server block (virtual host), not a path location —
# see the location = /assets/config.json comment below and Apache Superset GitHub issues for why.
http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    server_name _;

    client_max_body_size 1g;
    client_body_timeout 300s;

    # climsoft_pwa and climsoft_api are resolved lazily via Docker's embedded
    # DNS (below) rather than once at nginx startup, so a backend that's
    # crashed or still starting doesn't take nginx itself down — same reason
    # as the Superset server block. This isn't just theoretical: a stale
    # required-env-vars check in the API's entrypoint.sh once made
    # climsoft_api fail to start, and because /api/ used a literal hostname
    # back then, nginx refused to start too, breaking the PWA along with it —
    # for a bug that had nothing to do with the PWA.
    resolver 127.0.0.11 valid=30s;

    # assets/config.json isn't a real file served by `ng serve` — nginx
    # synthesises it here from the same SUPERSET_HOSTNAME the server block
    # below uses (substituted via envsubst at container start), so the PWA
    # can discover Superset's origin at runtime.
    location = /assets/config.json {
      add_header Content-Type application/json;
      return 200 '{"supersetHostname":"${SUPERSET_HOSTNAME}"}';
    }

    location /api/ {
      # climsoft_api's own routes live under /api too (app.setGlobalPrefix('api')
      # in main.ts), so the path is forwarded through unchanged — no rewrite
      # needed. $api_upstream is resolved lazily via the resolver above rather
      # than once at nginx startup, so the API being down doesn't take nginx
      # down with it.
      set $api_upstream climsoft_api:3000;
      proxy_pass http://$api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Origin $http_origin;

      proxy_connect_timeout 300s;
      proxy_send_timeout 300s;
      proxy_read_timeout 300s;
      proxy_request_buffering off;
      proxy_buffering off;
    }

    location / {
      set $pwa_upstream climsoft_pwa:4200;
      proxy_pass http://$pwa_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }

  # Apache Superset, on its own hostname/origin — see the comment on
  # location = /assets/config.json above for why. SUPERSET_HOSTNAME is
  # substituted here via envsubst at container start.
  server {
    listen 80;
    server_name ${SUPERSET_HOSTNAME};

    client_max_body_size 1g;
    client_body_timeout 300s;

    # climsoft_superset is optional (behind the "superset" compose profile)
    # and may not exist in Docker's DNS at all when nginx starts. A literal
    # `proxy_pass http://climsoft_superset:8088;` resolves that hostname
    # once, at config-load time, and nginx refuses to start AT ALL if it
    # can't ("host not found in upstream") — taking down the whole proxy,
    # not just this origin. Routing through a variable instead defers
    # resolution to request time via the resolver below (Docker's embedded
    # DNS), so nginx always starts regardless of whether Superset is
    # running, and only requests to this origin 502 until it is.
    resolver 127.0.0.11 valid=30s;

    location / {
      set $superset_upstream climsoft_superset:8088;
      proxy_pass http://$superset_upstream;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_connect_timeout 30s;
      proxy_read_timeout 300s;
    }
  }
}
