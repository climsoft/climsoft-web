<div class="card border-0">
  <div class="card-header d-flex justify-content-end align-items-center px-1 py-0">
    <div *ngIf="!loading && !errorMessage" class="mx-2">
      [{{ products.length | number:'1.0-0' }}]
    </div>
  </div>

  <div *ngIf="loading" class="card-body d-flex justify-content-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div *ngIf="errorMessage" class="card-body">
    <div class="alert alert-danger mb-0">{{ errorMessage }}</div>
  </div>

  <div *ngIf="!loading && !errorMessage" class="card-body px-0">
    <div class="app-table-container" style="max-height: 80vh;">
      <table class="table table-hover table-sm">
        <colgroup>
          <col style="width: 30%;" />
          <col style="width: 18%;" />
          <col style="width: 52%;" />
        </colgroup>
        <thead>
          <tr>
            <th>Name</th>
            <th>Category</th>
            <th>Description</th>
          </tr>
        </thead>
        <tbody class="table-group-divider">
          <tr class="app-cursor-pointer" *ngFor="let product of products" (click)="openProduct(product)">
            <td>{{ product.name }}</td>
            <td>{{ product.category || '—' }}</td>
            <td>{{ product.description || '—' }}</td>
          </tr>
          <tr *ngIf="products.length === 0">
            <td colspan="3" class="text-center text-muted py-4">
              No climate products are available.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
