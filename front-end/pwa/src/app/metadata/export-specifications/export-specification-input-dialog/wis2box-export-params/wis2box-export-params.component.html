<div *ngIf="wis2BoxExportParameters" class="card">
    <div class="card-header">WIS2BOX Configuration</div>
    <div class="card-body">
        <div>
            <app-selector-single-input [id]="'report_type_selector'" [label]="'Report Type'" [options]="reportTypes"
                [optionDisplayFn]="reportTypeDisplayFunction" [selectedOption]="wis2BoxExportParameters.reportType"
                (selectedOptionChange)="onReportTypeChange($event)" />
        </div>
        <hr />

        <div class="card">
            <div class="card-header">
                <div class="d-flex justify-content-between align-items-center">
                    <span>Element Mappings</span>
                    <button type="button" class="btn btn-sm btn-primary" (click)="onAddElementMapping()">
                        Add Mapping
                    </button>
                </div>
            </div>
            <div class="card-body">
                <div *ngIf="wis2BoxExportParameters.elementMappings.length === 0" class="text-muted text-center py-3">
                    No element mappings configured. Click "Add Mapping" to create one.
                </div>

                <table
                    *ngIf="wis2BoxElements.length > 0 && wis2BoxExportParameters.elementMappings.length > 0"
                    class="table table-sm">
                    <thead>
                        <tr>
                            <th>Database Element</th>
                            <th>WIS2BOX Element</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody class="table-group-divider">
                        <tr *ngFor="let mapping of wis2BoxExportParameters.elementMappings; let i = index">
                            <td>
                                <app-element-selector-single [id]="'db_element_' + i"
                                    [selectedId]="mapping.databaseElementId"
                                    (selectedIdChange)="onDBElementSelected(i, $event)" />
                            </td>
                            <td>
                                <app-selector-single-input [id]="'wis2box_element_' + i" [options]="wis2BoxElements"
                                    [optionDisplayFn]="wis2BoxElementDisplayFunction"
                                    [selectedOption]="mapping.wis2BoxElement"
                                    (selectedOptionChange)="onWis2BoxElementSelected(i, $event)" />
                            </td>
                            <td>
                                <button type="button" class="btn btn-sm btn-outline-danger"
                                    (click)="onRemoveElementMapping(i)">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>

            </div>
        </div>
    </div>
</div>
