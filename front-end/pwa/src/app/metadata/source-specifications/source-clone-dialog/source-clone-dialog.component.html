<ng-container *ngIf="open && sourceToClone">
    <app-dialog [(open)]="open" [title]="title"
        [firstButtonOptions]="{label: saving ? 'Cloning...' : 'Submit', color: 'primary', disable: saving, closeDialogOnClick: false}"
        (firstButtonClick)="onSave()"
        [secondButtonOptions]="{label: 'Cancel', color: 'secondary', closeDialogOnClick: true}">

        <div class="text-muted small mb-3">
            Cloning <strong>{{ sourceToClone.name }}</strong>. All other settings (parameters, hours, elements, UTC
            offset, flags) are copied as-is.
        </div>

        <div>
            <app-text-input [label]="'Name'" [(value)]="newName" />
        </div>

        <hr />

        <div>
            <app-text-input [label]="'Description'" [(value)]="newDescription" />
        </div>

    </app-dialog>

    <app-confirmation-dialog #dlgSaveConfirm [title]="'Clone Source Specification'" [okButtonLabel]="'Yes'"
        [cancelButtonLabel]="'No'" (okConfirmed)="onSaveConfirm()" [displayCannotBeUndone]="false">
        <p>
            Are you sure you want to clone source specification <strong>{{ sourceToClone.name }}</strong> and save it as
            <strong>{{ newName }}</strong>?
        </p>
    </app-confirmation-dialog>
</ng-container>
