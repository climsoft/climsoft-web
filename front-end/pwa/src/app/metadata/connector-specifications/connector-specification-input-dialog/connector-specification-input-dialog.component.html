<ng-container *ngIf="open && connector">
    <app-dialog [(open)]="open" [title]="title"
        [firstButtonOptions]="{label: 'Submit', color: 'primary', closeDialogOnClick: false}"
        (firstButtonClick)="onSubmitClick()"
        [secondButtonOptions]="connector.id > 0 ? {label: 'Delete', color: 'danger', closeDialogOnClick: false} : undefined"
        (secondButtonClick)="onDeleteButtonClick()"
        [thirdButtonOptions]="{label: 'Cancel', color: 'secondary', closeDialogOnClick: true}">

        <div>
            <div>
                <app-text-input [label]="'Name'" [(value)]="connector.name" />
            </div>

            <hr />

            <div>
                <app-text-input [label]="'Description'" [(value)]="connector.description" />
            </div>

            <hr />

            <div>
                <app-connector-type-selector-single [label]="'Connector Type'"
                    [selectedId]="connector.connectorType"
                    (selectedIdChange)="onConnectorTypeChange($event)" />
            </div>

            <hr />

            <div>
                <app-server-type-selector-single [label]="'Server Type'"
                    [selectedId]="connector.serverType"
                    (selectedIdChange)="onServerTypeChange($event)" />
            </div>

            <hr />

            <div>
                <app-text-input [label]="'Host Name'" [labelSuperScript]="'ip address or domain'"
                    [(value)]="connector.hostName" />
            </div>

            <hr />

            <div>
                <app-number-input [label]="'Timeout'" [labelSuperScript]="'Seconds'" [(numValue)]="connector.timeout" />
            </div>

            <hr />

            <div>
                <app-number-input [label]="'Retry Attempts'"
                    [labelSuperScript]="'retries after the first attempt; 0 = no retries'"
                    [(numValue)]="connector.retryAttempts" />
            </div>

            <hr />

            <div>
                <app-cron-input [label]="'Schedule'" [labelSuperScript]="'cron expression'"
                    [(value)]="connector.cronSchedule" />
            </div>

            <hr />

            <div class="card">
                <div class="card-header">Server Parameters</div>
                <div class="card-body">
                    <div *ngIf="connector.serverType === ServerTypeEnum.FILE_SERVER">
                        <app-file-server-parameters-input [connector]="connector"
                            (validationError)="onValidationError($event)" />
                    </div>
                    <div *ngIf="connector.serverType === ServerTypeEnum.WEB_SERVER" class="text-info">
                        Web servers will be supported in the next version release
                    </div>
                </div>
            </div>
            <hr />

            <!-- Disable toggle is hidden for new connectors: they start disabled
                 and stay that way until the user has saved the spec once and
                 verified the connection. -->
            <div *ngIf="connector.id > 0">
                <app-check-box-input [label]="'Disable'" [(value)]="connector.disabled" />
                <hr />
            </div>

            <div>
                <app-text-input [label]="'Comment'" [(value)]="connector.comment" />
            </div>
        </div>
    </app-dialog>

    <app-delete-confirmation-dialog #dlgDeleteConfirm [itemName]="connector.name" [itemType]="'connector'"
        (deleteConfirmed)="onDeleteConfirm()" />

</ng-container>
