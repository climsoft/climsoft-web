<div *ngIf="exportFileServerParameters">

    <div class="card">
        <div class="card-header">Observation Window</div>
        <div class="card-body">
            <p class="text-muted small mb-3">
                Each scheduled run exports observations whose chosen date falls within the look-back window.
            </p>

            <div class="mb-3">
                <app-number-input [label]="'Look back the last'" [labelSuperScript]="'minutes'"
                    [(numValue)]="exportFileServerParameters.observationWindow.durationMinutes" />
            </div>

            <div>
                <app-selector-single-input [label]="'Filter by'" [options]="dateFieldOptions"
                    [optionDisplayFn]="dateFieldDisplay" [selectedOption]="selectedDateFieldOption"
                    (selectedOptionChange)="onDateFieldChange($event)" />
            </div>
        </div>
    </div>

    <hr />

    <div class="card">
        <div class="card-header">
            <div class="d-flex justify-content-between align-items-center">
                <span>Export Specifications</span>
                <button type="button" class="btn btn-sm btn-primary" (click)="onAddSpecification()">
                    Add Specification
                </button>
            </div>
        </div>
        <div class="card-body">
            <div *ngIf="!exportFileServerParameters.specifications || exportFileServerParameters.specifications.length === 0"
                class="text-muted text-center py-3">
                No specifications configured. Click "Add Specification" to create one.
            </div>

            <div
                *ngIf="exportFileServerParameters.specifications && exportFileServerParameters.specifications.length > 0">
                <table class="table table-sm">
                    <thead>
                        <tr>
                            <th style="width: 1%"></th>
                            <th>#</th>
                            <th>Export Specification</th>
                            <th>Station</th>
                            <th></th>
                        </tr>
                    </thead>
                    <!-- Order is stored as each binding's sort_order and reads
                         back in it, so dragging a row is persisted on save. -->
                    <tbody class="table-group-divider" cdkDropList
                        [cdkDropListData]="exportFileServerParameters.specifications"
                        (cdkDropListDropped)="onDragDrop($event)" cdkDropListOrientation="vertical">
                        <tr *ngFor="let item of exportFileServerParameters.specifications; let i = index;"
                            cdkDrag style="user-select: none;">
                            <!-- A handle rather than a draggable row: the other
                                 cells hold selectors, and dragging from those
                                 would fight their dropdowns. -->
                            <td cdkDragHandle class="app-cursor-drag text-muted" title="Drag to reorder">
                                <i class="bi-grip-vertical"></i>
                            </td>
                            <td>{{ i + 1 }}</td>
                            <td>
                                <app-export-specification-selector-single [id]="i + '_db_export_specification'"
                                    [selectedId]="item.specificationId"
                                    (selectedIdChange)="onSpecificationIdChange(i, $event)" />
                            </td>
                            <td>
                                <app-station-selector-single [id]="i + '_db_station'" [selectedId]="item.stationId"
                                    (selectedIdChange)="onStationIdChange(i, $event)" />
                            </td>
                            <td>
                                <button type="button" class="btn btn-sm btn-outline-danger"  title="Remove Specification"
                                    (click)="onRemoveSpecification(i)">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
