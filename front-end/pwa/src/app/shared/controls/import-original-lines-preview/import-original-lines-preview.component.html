<div>
    <!-- No file uploaded -->
    <div *ngIf="!hasFile && !loading" class="text-center text-muted py-5">
        <i class="bi bi-file-earmark-text" style="font-size: 2rem;"></i>
        <div class="mt-2">{{ noFileMessage }}</div>
    </div>

    <!-- Loading spinner -->
    <app-spinner *ngIf="loading" [message]="'Reading file...'" />

    <!-- Lines -->
    <div *ngIf="hasFile && !loading" class="lines-block" [style.max-height]="maxHeight">
        <div *ngIf="lines.length > 0" class="section">
            <div class="section-label small text-muted">
                {{ lines.length }} line<span *ngIf="lines.length !== 1">s</span>
            </div>
            <pre class="lines">{{ lines.join('\n') }}</pre>
        </div>

        <div *ngIf="lines.length === 0" class="text-center text-muted py-3">
            File is empty
        </div>
    </div>
</div>
