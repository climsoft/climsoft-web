<div class="bg-one"></div>
<div class="container vh-100 d-flex justify-content-center align-items-center">
    <div class="row justify-content-center w-100">
        <div class="col-md-6">
            <div class="card border-0">
                <div class="card-header border-0"> CLIMSOFT WEB <!--  TODO Climsoft logo --> </div>
                <div class="card-body">
                    <div class="service-head">
                        <div class="service-title">Log in</div>
                        <div class="service-body">
                            To Access Climsoft
                        </div>

                    </div>
                    <div *ngIf="errorMessage" class="alert alert-danger">{{errorMessage}}</div>
                    <form (ngSubmit)="login()">
                        <!-- simulateTabOnEnter is off so Enter submits the form rather than moving focus -->
                        <div class="mb-3">
                            <app-text-input [type]="'email'" [id]="'email'" [label]="'Email'"
                                [displaylabelFullColon]="false" [simulateTabOnEnter]="false"
                                [autocomplete]="'username'" [(value)]="email" />
                        </div>
                        <div class="mb-3">
                            <app-text-input [type]="'password'" [id]="'password'" [label]="'Password'"
                                [displaylabelFullColon]="false" [simulateTabOnEnter]="false"
                                [autocomplete]="'current-password'" [(value)]="password" />
                        </div>
                        <!-- <div class="d-flex justify-content-end">
                            <a [href]="'/password-reset'">Forgot password</a>
                        </div> -->
                        <div class="d-flex justify-content-end">
                            <button type="submit" class="btn btn-outline-primary">Login</button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
