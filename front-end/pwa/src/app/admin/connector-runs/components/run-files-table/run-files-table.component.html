<div class="app-table-container" style="max-height: 80vh;">
    <table class="table table-sm table-bordered mb-0">
        <thead class="table-light">
            <tr>
                <th style="width: 1%"></th>
                <th>File</th>
                <th>Size</th>
                <th>Date</th>
                <th>Status</th>
                <th class="text-end">Observations</th>
                <th>Time</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <ng-container *ngFor="let file of files">
                <!-- A row that recorded something — a failure, or the explanation
                 an empty file carries — is clickable and reveals it underneath.
                 Anything else is inert, so the pointer only changes where there
                 is actually something to open. Only the colouring keys off the
                 failure itself: an empty file is not an error. -->
                <tr [class.table-danger]="hasFileError(file)" [class.expandable-row]="hasFileMessage(file)"
                    [attr.tabindex]="hasFileMessage(file) ? 0 : null" [attr.role]="hasFileMessage(file) ? 'button' : null"
                    [attr.aria-expanded]="hasFileMessage(file) ? isExpanded(file) : null" (click)="onRowClick(file)"
                    (keydown.enter)="onRowClick(file)" (keydown.space)="onRowClick(file); $event.preventDefault()">
                    <td class="text-center text-muted">
                        <span *ngIf="hasFileMessage(file)" class="expand-caret"
                            [class.expanded]="isExpanded(file)">&#9656;</span>
                    </td>
                    <td>{{ getFileName(file) }}</td>
                    <td>{{ getFileSize(file) }}</td>
                    <td>{{ getFileDate(file) }}</td>
                    <td>
                        <span class="badge" [ngClass]="getFileStatusClass(file)">{{ getFileStatus(file) }}</span>
                    </td>
                    <!-- Only a file that imported in this run has a count; a skipped
                     file wrote nothing this time round. -->
                    <td class="text-end" [class.text-muted]="file.observationRows === null">
                        {{ file.observationRows === null ? '—' : file.observationRows.toLocaleString() }}
                    </td>
                    <td class="text-nowrap text-muted" [title]="getFileTimeBreakdown(file)">{{ getFileTime(file) }}</td>
                    <td class="text-end">
                        <!-- stopPropagation: downloading must not also toggle the row. -->
                        <button *ngIf="canDownloadFile(file)" type="button"
                            class="btn btn-sm btn-outline-secondary py-0"
                            title="Download the downloaded file and anything processing produced before it failed"
                            (click)="onDownloadFileClick(file); $event.stopPropagation()">
                            Download
                        </button>
                    </td>
                </tr>
                <tr *ngIf="hasFileMessage(file) && isExpanded(file)" class="error-detail-row">
                    <td></td>
                    <td colspan="7">
                        <div class="error-font-size mb-0" [class.text-danger]="hasFileError(file)"
                            [class.text-muted]="!hasFileError(file)">{{ getFileError(file) }}</div>
                    </td>
                </tr>
            </ng-container>
            <tr *ngIf="files.length === 0">
                <td colspan="8" class="text-center text-muted py-3">No files</td>
            </tr>
        </tbody>
    </table>
</div>
