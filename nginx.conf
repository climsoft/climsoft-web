events {}

http {
  # Conditionally set Connection header for WebSocket proxying.
  # Sends "upgrade" only when the client initiates a WebSocket handshake;
  # otherwise clears the hop-by-hop Connection header for plain HTTP.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # The scheme the browser actually used. When something in front of this
  # nginx terminates TLS (e.g. a Cloudflare tunnel), nginx itself only sees
  # plain HTTP, so $scheme alone would tell Superset "http" while the
  # browser is on https — and Superset would then build http:// URLs into
  # an https page. Pass through the incoming X-Forwarded-Proto when there
  # is one, and fall back to $scheme when nginx is the first hop.
  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
  }

# HTTP Server Block
  server {
    listen 80;

    # Allow requests from any domain/IP address
    server_name _;

    client_max_body_size 1g; # allow uploads upto a maximum of 1GB. Note API allows body size of 1MB and multipart of 1GB for observations uploads
    client_body_timeout 300s; # Timeout for reading client request body (5 minutes  due to potential slow connections and large file size)
    #client_header_timeout 300s; # Timeout for reading client request header (5 minutes due to potential slow connections)

    # climsoft_pwa and climsoft_api are resolved lazily via Docker's embedded
    # DNS (below) rather than once at nginx startup, so a backend that's
    # crashed or still starting doesn't take nginx itself down — same reason
    # as the Superset server block.
    resolver 127.0.0.11 valid=30s;

    #------------------------------------
    # # Enable this block when you want to use https
    # location / {
    #   return 301 https://$host$request_uri;
    # }

    #------------------------------------
    # Disable this block when you don't want to use http
    # Serve Angular (PWA) Requests
    location / {
      set $pwa_upstream climsoft_pwa:80;
      proxy_pass http://$pwa_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # Try Angular paths
      proxy_intercept_errors on;
      error_page 404 = @angular_fallback;
    }

    # assets/config.json isn't a real file in the PWA build — nginx
    # synthesises it here (values substituted via envsubst at container
    # start), so the PWA can discover where Superset lives at runtime.
    # supersetPort is the HOST port the Superset server block below is
    # published on; the PWA combines it with the page's own hostname.
    # supersetUrl, when set, overrides that entirely — for deployments where
    # Superset is reached through its own public hostname instead (e.g. a
    # Cloudflare tunnel, which routes by hostname, not port).
    location = /assets/config.json {
      add_header Content-Type application/json;
      return 200 '{"supersetPort":"${HOST_SUPERSET_PORT}","supersetUrl":"${SUPERSET_PUBLIC_URL}"}';
    }

    # Proxy API Requests to NestJS
    location /api/ {
      # climsoft_api's own routes live under /api too (app.setGlobalPrefix('api')
      # in main.ts), so the path is forwarded through unchanged — no rewrite
      # needed. $api_upstream is resolved lazily via the resolver above rather
      # than once at nginx startup, so the API being down doesn't take nginx
      # down with it.
      set $api_upstream climsoft_api:3000;
      proxy_pass http://$api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Origin $http_origin;  # Forward the Origin header. TODO this is not forwarded to NestJS yet, so investigate why.

      # Large upload settings
      proxy_connect_timeout 300s; # just incase api server is overloaded and slow to accept new connections (especially when sending multiple large files to it)
      proxy_send_timeout 300s; # A 1GB file being streamed, it might take more than 60s to transmit
      proxy_read_timeout 300s; # API might take more than 60s to process a large file (e.g duckdb processing and saving to db )
      proxy_request_buffering off; # Switch off because for large uploads TO backend
      proxy_buffering off; # Stream directly from the API
    }

    location @angular_fallback {
      # set must come before rewrite...break — break halts every subsequent
      # ngx_http_rewrite_module directive in this location (set belongs to
      # that same module), so a set placed after break would never run,
      # leaving $pwa_upstream empty.
      set $pwa_upstream climsoft_pwa:80;
      rewrite ^ /index.html break;
      proxy_pass http://$pwa_upstream;
    }
    #------------------------------------
  }

  # Apache Superset, on its own port. It can't live under a path of the
  # main server block (e.g. /superset/): Superset's frontend emits absolute
  # root-relative URLs, and some of its own views hardcode a /superset
  # prefix, so it has to own the root of its origin. A separate port gives
  # it that origin while staying reachable by any address that reaches this
  # server — an IP, localhost, or any hostname — with no DNS or hosts-file
  # setup. Compose publishes it on the host as HOST_SUPERSET_PORT.
  server {
    listen 8088;

    client_max_body_size 1g;
    client_body_timeout 300s;

    # climsoft_superset is optional (behind the "superset" compose profile —
    # see docker-compose.*.yaml) and may not exist in Docker's DNS at all
    # when nginx starts. A literal `proxy_pass http://climsoft_superset:8088;`
    # resolves that hostname once, at config-load time, and nginx refuses to
    # start AT ALL if it can't ("host not found in upstream") — taking down
    # the whole proxy, not just this origin. Routing through a variable
    # instead defers resolution to request time via the resolver below
    # (Docker's embedded DNS), so nginx always starts regardless of whether
    # Superset is running, and only requests to this origin 502 until it is.
    resolver 127.0.0.11 valid=30s;

    location / {
      set $superset_upstream climsoft_superset:8088;
      proxy_pass http://$superset_upstream;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;

      # WebSocket support for Superset async queries
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_connect_timeout 30s;
      proxy_read_timeout 300s;
    }
  }
}