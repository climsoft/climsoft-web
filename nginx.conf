events {}

http {
  # Conditionally set Connection header for WebSocket proxying.
  # Sends "upgrade" only when the client initiates a WebSocket handshake;
  # otherwise clears the hop-by-hop Connection header for plain HTTP.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

# HTTP Server Block
  server {
    listen 80;

    # Allow requests from any domain/IP address
    server_name _;

    client_max_body_size 1g; # allow uploads upto a maximum of 1GB. Note API allows body size of 1MB and multipart of 1GB for observations uploads
    client_body_timeout 300s; # Timeout for reading client request body (5 minutes  due to potential slow connections and large file size)
    #client_header_timeout 300s; # Timeout for reading client request header (5 minutes due to potential slow connections)

    #------------------------------------
    # # Enable this block when you want to use https
    # location / {
    #   return 301 https://$host$request_uri;
    # }

    #------------------------------------
    # Disable this block when you don't want to use http
    # Serve Angular (PWA) Requests
    location / {
      proxy_pass http://climsoft_pwa:80;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # Try Angular paths
      proxy_intercept_errors on;
      error_page 404 = @angular_fallback;
    }

    # assets/config.json isn't a real file served by `ng serve` — nginx
    # synthesises it here from the same SUPERSET_HOSTNAME the server block
    # below uses (substituted via envsubst at container start), so the PWA
    # can discover Superset's origin at runtime.
    location = /assets/config.json {
      add_header Content-Type application/json;
      return 200 '{"supersetHostname":"${SUPERSET_HOSTNAME}"}';
    }

    # Proxy API Requests to NestJS
    location /api/ {
      proxy_pass http://climsoft_api:3000/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Origin $http_origin;  # Forward the Origin header. TODO this is not forwarded to NestJS yet, so investigate why.

      # Large upload settings
      proxy_connect_timeout 300s; # just incase api server is overloaded and slow to accept new connections (especially when sending multiple large files to it)
      proxy_send_timeout 300s; # A 1GB file being streamed, it might take more than 60s to transmit
      proxy_read_timeout 300s; # API might take more than 60s to process a large file (e.g duckdb processing and saving to db )
      proxy_request_buffering off; # Switch off because for large uploads TO backend
      proxy_buffering off; # Stream directly from the API
    }

    location @angular_fallback {
      proxy_pass http://climsoft_pwa:80;
      rewrite ^ /index.html break;
    }
    #------------------------------------
  }

  # Apache Superset, on its own hostname/origin — see the comment on
  # location = /assets/config.json above for why it can't share the main
  # server block's origin. SUPERSET_HOSTNAME is substituted here via
  # envsubst at container start (see Dockerfile); it must be a hostname
  # that actually resolves to wherever this nginx runs (a real DNS
  # subdomain in production).
  server {
    listen 80;
    server_name ${SUPERSET_HOSTNAME};

    client_max_body_size 1g;
    client_body_timeout 300s;

    # climsoft_superset is optional (behind the "superset" compose profile —
    # see docker-compose.*.yaml) and may not exist in Docker's DNS at all
    # when nginx starts. A literal `proxy_pass http://climsoft_superset:8088;`
    # resolves that hostname once, at config-load time, and nginx refuses to
    # start AT ALL if it can't ("host not found in upstream") — taking down
    # the whole proxy, not just this origin. Routing through a variable
    # instead defers resolution to request time via the resolver below
    # (Docker's embedded DNS), so nginx always starts regardless of whether
    # Superset is running, and only requests to this origin 502 until it is.
    resolver 127.0.0.11 valid=30s;

    location / {
      set $superset_upstream climsoft_superset:8088;
      proxy_pass http://$superset_upstream;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # WebSocket support for Superset async queries
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_connect_timeout 30s;
      proxy_read_timeout 300s;
    }
  }

